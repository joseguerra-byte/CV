backend:
  name: git-gateway
  branch: main # Asegúrate de que tu rama se llame main

media_folder: "assets/img" 
public_folder: "/assets/img"

collections:
  - name: "landing"
    label: "Contenido de la Web"
    files:
      - file: "index.html"
        label: "Página Principal"
        name: "home"
        fields:
          - {label: "Título Principal", name: "hero_title", widget: "string"}
          - {label: "Subtítulo / Descripción", name: "hero_desc", widget: "text"}
          - {label: "Texto del Botón", name: "cta_text", widget: "string"}
